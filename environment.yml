name: MShogi
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - pytest
  - pyyaml
  - tqdm
  - zstandard
  - jupyterlab
  - pip:
      - onnx
      - onnxruntime
      - onnxscript
      - tensorboard
      - pybind11

# CUDA 12.9 驱动下使用官方 CUDA 12.6 wheel（Windows/Python 3.11）：
# python -m pip install torch==2.13.0+cu126 --index-url https://download.pytorch.org/whl/cu126
# 如仅需 CPU 调试，可改用 https://download.pytorch.org/whl/cpu。
