name: MShogi
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy
  - pandas
  - matplotlib
  - scikit-learn
  - pytest
  - pyyaml
  - tqdm
  - zstandard
  - jupyterlab
  - pip:
      - onnx
      - onnxruntime
      - onnxscript
      - tensorboard
      - pybind11

# 本地调试使用官方 CPU wheel：
# python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
# GPU 训练机可改用与驱动匹配的官方 CUDA wheel。
